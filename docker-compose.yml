services:

  api:
    build: .
    container_name: employee-api
    ports:
      - "8000:8000"

    environment:
      DB_USER: ebinejar_user
      DB_PASSWORD: Naaga@2506
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: employee_db

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: employee-db

    environment:
      POSTGRES_USER: ebinejar_user
      POSTGRES_PASSWORD: Naaga@2506
      POSTGRES_DB: employee_db

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebinejar_user -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: